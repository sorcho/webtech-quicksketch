<main class="mx-auto w-full max-w-sm p-4 sm:max-w-6xl">
    <div class="mb-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-slate-900">Sketches</h1>
        <a routerLink="/sketches/new"
            class="rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-500">
            Create sketch
        </a>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
        @for (sketch of sketches(); track sketch.id) {
        <app-sketch-card [id]="sketch.id" [image]="sketch.image" />
        }
    </div>
</main>
