@if (sketch(); as s) {
<main class="mx-auto w-full max-w-md p-4">
    <img class="w-full aspect-square rounded-lg border border-gray-300 bg-white object-cover"
        [src]="baseImageURL + s.image" alt="Sketch">

    <p class="mt-3 text-sm text-gray-500">
        By {{ s.User.username }} · {{ s.createdAt | date: 'mediumDate' }}
    </p>

    <form (ngSubmit)="onSubmit()" [formGroup]="sketchForm" class="mt-4 flex gap-2">
        <input type="text" formControlName="word" placeholder="Your guess"
            class="w-full rounded-md bg-white px-3 py-2.5 text-sm text-slate-900 outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-teal-600 disabled:cursor-not-allowed disabled:opacity-50" />
        <button type="submit" [disabled]="!canGuess()"
            class="rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-500 cursor-pointer disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-teal-600">
            Guess
        </button>
    </form>

    @if (authState() === 'anonymous') {
    <p class="mt-2 text-sm text-gray-500">
        <a routerLink="/auth" [queryParams]="{mode: 'signin'}" class="font-medium text-teal-700 hover:underline">Sign
            in</a>
        to guess.
    </p>
    }
</main>
}
