<header class="bg-white" (click)="closeMenu()">
    <div class="mx-auto max-w-full px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between">
            <div class="md:flex md:items-center md:gap-12"> <!-- LOGO -->
                <a class="block text-teal-600" routerLink="/">
                    <span class="sr-only">Home</span>
                    <img src="/logo.png" alt="logo">
                </a>
            </div>

            <div class="hidden md:block">
                <nav aria-label="Global">
                    <ul class="flex items-center gap-6 text-sm">
                        <!-- <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" routerLink="#"> About </a>
                        </li> -->

                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" routerLink="/leaderboards">
                                Leaderboards
                            </a>
                        </li>

                        <li>
                            <a class="text-gray-500 transition hover:text-gray-500/75" routerLink="/sketches"> Sketches
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="flex items-center gap-4">
                <div class="sm:flex sm:gap-4">
                    <a class="transition hover:bg-teal-500 rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm"
                        routerLink="/auth" [queryParams]="{mode: 'signin'}">
                        Sign In
                    </a>

                    <div class="hidden sm:flex">
                        <a class="transition hover:bg-gray-200 rounded-md bg-gray-100 px-5 py-2.5 text-sm font-medium text-teal-600"
                            routerLink="/auth" [queryParams]="{mode: 'signup'}">
                            Sign Up
                        </a>
                    </div>
                </div>

                <div class="block md:hidden">
                    <button class="rounded-sm bg-gray-100 p-2 text-gray-600 transition hover:text-gray-600/75"
                        (click)="toggleHamburger()">
                        <span class="sr-only">Toggle menu</span>

                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>


                </div>
            </div>
        </div>
    </div>
</header>

<div dir="rtl" class="fixed inset-y-0 inset-s-0 z-50" [class.hidden]="isMenuClosed()">
    <div class="flex h-screen w-16 flex-col justify-between border-e border-gray-100 bg-white">
        <div>
            <ul class="space-y-1 border-t border-gray-100 px-2 pt-4">
                <li>
                    <a href="#"
                        class="group relative grid place-content-center rounded-lg hover:bg-gray-100 px-4 py-2 text-gray-900"
                        aria-label="Profile">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>

                        <span
                            class="invisible absolute inset-s-full top-1/2 ms-4 -translate-y-1/2 rounded-sm bg-gray-200 px-2 py-1.5 text-xs font-medium text-gray-700 group-hover:visible">
                            Profile
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="group relative grid place-content-center rounded-lg px-4 py-2 text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900"
                        aria-label="Teams">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>

                        <span
                            class="invisible absolute inset-s-full top-1/2 ms-4 -translate-y-1/2 rounded-sm bg-gray-200 px-2 py-1.5 text-xs font-medium text-gray-700 group-hover:visible">
                            Teams
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="group relative grid place-content-center rounded-lg px-4 py-2 text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900"
                        aria-label="Billing">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>

                        <span
                            class="invisible absolute inset-s-full top-1/2 ms-4 -translate-y-1/2 rounded-sm bg-gray-200 px-2 py-1.5 text-xs font-medium text-gray-700 group-hover:visible">
                            Billing
                        </span>
                    </a>
                </li>

                <li>
                    <a href="#"
                        class="group relative grid place-content-center rounded-lg px-4 py-2 text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900"
                        aria-label="Invoices">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>

                        <span
                            class="invisible absolute inset-s-full top-1/2 ms-4 -translate-y-1/2 rounded-sm bg-gray-200 px-2 py-1.5 text-xs font-medium text-gray-700 group-hover:visible">
                            Invoices
                        </span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sticky inset-x-0 bottom-0 border-t border-gray-100 bg-white p-2">
            <a href="#"
                class="group relative grid place-content-center rounded-lg px-4 py-2 text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900"
                aria-label="Logout">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>

                <span
                    class="invisible absolute inset-s-full top-1/2 ms-4 -translate-y-1/2 rounded-sm bg-gray-200 px-2 py-1.5 text-xs font-medium text-gray-700 group-hover:visible">
                    Logout
                </span>
            </a>
        </div>
    </div>
</div>
