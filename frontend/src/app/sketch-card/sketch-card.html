<div class="flex flex-col gap-3 rounded-lg border border-gray-300 bg-white p-3">
    <div class="relative">
        <img class="w-full aspect-square rounded-md object-cover" [src]="baseImageURL + image()">
        @if (badge(); as b) {
        <span class="absolute left-2 top-2 rounded-full px-2.5 py-1 text-xs font-semibold shadow-sm"
            [class]="b.classes">
            {{ b.label }}
        </span>
        }
    </div>
    <a [routerLink]="['/sketches', id()]"
        class="w-full rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-500 cursor-pointer text-center">
        {{ buttonLabel() }}
    </a>
</div>
