@if (!authService.isLoggedIn()) {
non sei loggato
} @else {
<form [formGroup]="sketchForm" (ngSubmit)="onSubmit()">

</form>
}

<div class="mx-auto flex w-full max-w-md flex-col items-center gap-4 p-4">
    <canvas #canvas class="block aspect-square w-full touch-none rounded-lg border border-gray-300 bg-white"
        (onResize)="this.signaturePadService.resize()" #resizingElement>
    </canvas>
    <div class="inline-flex">
        <button [cpOutputFormat]="'rgba'" [cpAlphaChannel]="'disabled'" [colorPicker]="strokeColor()"
            [style.background]="strokeColor()" (colorPickerChange)="updateColor($event)" [style.color]="iconColor()"
            title="Change pen color"
            class="-ms-px border border-gray-200 px-3 py-2 text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-hidden disabled:pointer-events-auto disabled:opacity-50"
            aria-label="Edit">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
            </svg>
        </button>

        <button title="Clear canvas" (click)="this.signaturePadService.clear()"
            class="-ms-px rounded-e-sm border border-gray-200 px-3 py-2 text-gray-700 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:z-10 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-white focus:outline-hidden disabled:pointer-events-auto disabled:opacity-50"
            aria-label="Delete">
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
        </button>
    </div>

    <p class="text-lg font-medium">{{ randomWord() }}</p>

    <button type="submit"
        class="rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-500">
        Submit
    </button>
</div>
